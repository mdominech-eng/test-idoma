<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>IDOMA - Eye Tracking Test</title>
  <!-- Libreria WebGazer.js caricata da CDN affidabile -->
  <script src="https://cdn.jsdelivr.net/npm/webgazer@2.1.0/dist/webgazer.js" type="text/javascript"></script>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; }
    #video-container { display: none; width: 100vw; height: 100vh; justify-content: center; align-items: center; position: relative; }
    video { max-width: 100%; max-height: 100%; }
    #intro { position: absolute; top: 35%; width: 100%; }
    
    /* Stile per i pulsanti */
    .btn-start { padding: 18px 36px; font-size: 20px; cursor: pointer; background: #00a86b; color: white; border: none; border-radius: 6px; font-weight: bold; }
    
    /* Pulsante di stop d'emergenza in alto a destra */
    #stop-btn { 
      display: none; 
      position: absolute; 
      top: 20px; 
      right: 20px; 
      padding: 12px 24px; 
      font-size: 15px; 
      background: #e63946; 
      color: white; 
      border: none; 
      border-radius: 5px; 
      cursor: pointer; 
      z-index: 9999;
      font-weight: bold;
      box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
    }
    #stop-btn:hover { background: #c1121f; }
    #status { margin-top: 15px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>

  <!-- Schermata Iniziale -->
  <div id="intro">
    <h1>Test di Tracciamento Oculare - IDOMA</h1>
    <p>Assicurati che la webcam sia attiva e di essere in un ambiente ben illuminato.</p>
    <button class="btn-start" onclick="startTest()">AVVIA TEST</button>
    <div id="status"></div>
  </div>

  <!-- Container per il Video (con link diretto a Google Drive) e il Pulsante di Stop -->
  <div id="video-container">
    <button id="stop-btn" onclick="stopAndSave()">TERMINA E SALVA DATI</button>
    <video id="myVideo" src="https://drive.google.com/uc?export=download&id=1512BMS4XmjqMY6pnLVgcwEq7dQ2Yv0xw" muted playsinline></video>
  </div>

  <script>
    let gazeData = [];
    let isTesting = false;

    async function startTest() {
      document.getElementById('status').innerText = "Inizializzazione webcam in corso...";

      try {
        // Inizializza WebGazer per registrare X, Y e tempo
        await webgazer.setGazeListener(function(data, elapsedTime) {
          if (data == null || !isTesting) return;
          gazeData.push({
            time: Math.round(elapsedTime),
            x: Math.round(data.x),
            y: Math.round(data.y)
          });
        }).begin();

        // Nasconde il riquadro dell'anteprima webcam per non distrarre l'utente
        webgazer.showVideoPreview(true).showPredictionPoints(true);

        isTesting = true;

        // Mostra il container del video
        document.getElementById('intro').style.display = 'none';
        document.getElementById('video-container').style.display = 'flex';
        document.getElementById('stop-btn').style.display = 'block';

        // Fa partire il video da Google Drive
        const video = document.getElementById('myVideo');
        video.play();

        // Se il video arriva alla fine naturalmente
        video.onended = function() {
          stopAndSave();
        };

      } catch (err) {
        alert("Errore nell'accesso alla webcam: assicurati di aver concesso i permessi al browser.");
        console.error(err);
      }
    }

    // Funzione richiamata sia a fine video sia al click del pulsante rosso
    function stopAndSave() {
      if (!isTesting) return; // Evita salvataggi doppi
      isTesting = false;

      const video = document.getElementById('myVideo');
      video.pause();
      
      // Ferma WebGazer e spegne la webcam
      try { webgazer.end(); } catch(e) {}

      // Scarica il file CSV
      downloadCSV();
      
      // Nasconde il pulsante dopo il salvataggio
      document.getElementById('stop-btn').style.display = 'none';
    }

    // Funzione per generare e scaricare il CSV
    function downloadCSV() {
      if (gazeData.length === 0) {
        alert("Nessun dato registrato.");
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,Timestamp_ms,X_pixel,Y_pixel\n";
      gazeData.forEach(function(row) {
        csvContent += `${row.time},${row.x},${row.y}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      
      // Crea un nome file univoco con la data/ora corrente
      const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
      link.setAttribute("download", `eyetracking_IDOMA_${timestamp}.csv`);
      
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      alert('Test completato! File scaricato nei Download con ' + gazeData.length + ' punti registrati.');
    }
  </script>
</body>
</html>
