<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>IDOMA - Eye Tracking Test</title>
  <!-- Libreria WebGazer.js da CDN -->
  <script src="https://cdn.jsdelivr.net/npm/webgazer@2.1.0/dist/webgazer.js" type="text/javascript"></script>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; }
    #video-container { display: none; width: 100vw; height: 100vh; justify-content: center; align-items: center; position: relative; }
    video { max-width: 100%; max-height: 100%; }
    #intro { position: absolute; top: 30%; width: 100%; z-index: 100; }
    
    .btn-start { padding: 18px 36px; font-size: 20px; cursor: pointer; background: #00a86b; color: white; border: none; border-radius: 6px; font-weight: bold; margin-top: 15px; }
    
    #stop-btn { 
      display: none; 
      position: absolute; 
      top: 20px; 
      right: 20px; 
      padding: 12px 24px; 
      font-size: 15px; 
      background: #e63946; 
      color: white; 
      border: none; 
      border-radius: 5px; 
      cursor: pointer; 
      z-index: 9999;
      font-weight: bold;
      box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
    }
    #stop-btn:hover { background: #c1121f; }
    #status { margin-top: 15px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>

  <!-- Schermata Iniziale -->
  <div id="intro">
    <h1>Test di Tracciamento Oculare - IDOMA</h1>
    <p>Posizionati al centro del riquadro della fotocamera in alto a sinistra.<br>Assicurati di essere ben illuminato e a una distanza confortevole dallo schermo.</p>
    <button class="btn-start" onclick="startTest()">AVVIA TEST</button>
    <div id="status"></div>
  </div>

  <!-- Container per il Video e il Pulsante di Stop -->
  <div id="video-container">
    <button id="stop-btn" onclick="stopAndSave()">TERMINA E SALVA DATI</button>
    <video id="myVideo" src="https://drive.google.com/uc?export=download&id=1512BMS4XmjqMY6pnLVgcwEq7dQ2Yv0xw" muted playsinline></video>
  </div>

  <script>
    let gazeData = [];
    let isTesting = false;

    // Inizializza subito la webcam appena si carica la pagina
    window.onload = async function() {
      document.getElementById('status').innerText = "Inizializzazione fotocamera in corso...";
      
      try {
        await webgazer.setGazeListener(function(data, elapsedTime) {
          if (data == null || !isTesting) return;
          gazeData.push({
            time: Math.round(elapsedTime),
            x: Math.round(data.x),
            y: Math.round(data.y)
          });
        }).begin();

        // Mostra l'anteprima fotocamera SUBITO per verificare l'inquadratura
        webgazer.showVideoPreview(true).showPredictionPoints(false);
        document.getElementById('status').innerText = "Fotocamera pronta. Inquadrati bene e clicca AVVIA TEST.";
      } catch (err) {
        document.getElementById('status').innerText = "Errore: Consenti l'accesso alla webcam nelle impostazioni del browser.";
      }
    };

    function startTest() {
      isTesting = true;

      // Nasconde la casella webcam durante la visione del video per non distrarre l'utente
      try { webgazer.showVideoPreview(false); } catch(e) {}

      document.getElementById('intro').style.display = 'none';
      document.getElementById('video-container').style.display = 'flex';
      document.getElementById('stop-btn').style.display = 'block';

      const video = document.getElementById('myVideo');
      video.play();

      video.onended = function() {
        stopAndSave();
      };
    }

    function stopAndSave() {
      if (!isTesting) return;
      isTesting = false;

      const video = document.getElementById('myVideo');
      video.pause();
      
      try { webgazer.end(); } catch(e) {}

      downloadCSV();
      document.getElementById('stop-btn').style.display = 'none';
    }

    function downloadCSV() {
      if (gazeData.length === 0) {
        alert("Nessun dato registrato.");
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,sep=,\nTimestamp_ms,X_pixel,Y_pixel\n";
      gazeData.forEach(function(row) {
        csvContent += `${row.time},${row.x},${row.y}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      
      const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
      link.setAttribute("download", `eyetracking_IDOMA_${timestamp}.csv`);
      
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      alert('Test completato! File salvato con ' + gazeData.length + ' punti registrati.');
    }
  </script>
</body>
</html>
